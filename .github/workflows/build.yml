name: Build MyAI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x64
          - runner: macos-15-intel
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test Java modules
        run: mvn -B -ntp verify
      - name: Package Windows application image
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
          $marker = Join-Path $env:RUNNER_TEMP 'myai-smoke.txt'
          $exe = (Resolve-Path 'dist/windows/MyAI/MyAI.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', ('"{0}"' -f $marker)) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(20000)) { $process | Stop-Process; throw 'Desktop startup timed out.' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $marker)) { throw 'Desktop startup failed.' }
      - name: Package macOS Intel disk image
        if: matrix.platform == 'macos-x64'
        run: |
          bash scripts/package-macos.sh
          hdiutil verify dist/macos/*.dmg
      - name: Package macOS Apple Silicon disk image
        if: matrix.platform == 'macos-arm64'
        run: bash scripts/package-macos-arm64.sh
      - name: Upload Windows desktop
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MyAI-windows-x64
          path: dist/windows/MyAI/
          if-no-files-found: error
      - name: Upload macOS desktop
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MyAI-${{ matrix.platform }}
          path: dist/macos/*.dmg
          if-no-files-found: error
      - name: Upload server and portable desktop JARs
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MyAI-java
          path: |
            server/target/myai-server.jar
            desktop/target/myai-desktop.jar
          if-no-files-found: error

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android
        run: gradle -p android --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MyAI-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
