plugins {
    id 'com.android.application' version '8.9.3'
}

android {
    namespace 'local.gateway.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'local.gateway.mobile'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'
}
